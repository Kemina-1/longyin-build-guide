 class="core">${core}</div><h3>完整武學資料 · 品質／來源／附加效果／傷害加成權重／修煉效果</h3><div class="scroll"><table><thead><tr><th>武學</th><th>品質</th><th>來源</th><th>武學附加效果</th><th>傷害加成權重</th><th>修煉效果</th><th>攻擊距離／範圍</th></tr></thead><tbody>${trs}</tbody></table></div><h3>推薦天賦（流派最佳化）</h3><div class="tals">${talents}</div><h3>流派判斷</h3><p>${esc(r.explain)}</p><div class="note">推薦培養方向：${esc(r.priority)}。此方向為構築建議，不代表 Excel 的突破可選詞條。</div><div class="actions"><button onclick="copyOne(${i})">複製 ${esc(r.name)} 配置</button></div></div></article>`}function render(){let f=document.getElementById('filter').value,s=document.getElementById('search').value.trim().toLowerCase();document.getElementById('list').innerHTML=roster.map((r,i)=>({r,i})).filter(({r})=>(!f||r.name===f)&&(!s||JSON.stringify(r).toLowerCase().includes(s))).map(({r,i})=>card(r,i)).join('')||'<p>沒有符合條件的流派。</p>'}function toggle(i){document.getElementById('c'+i)?.classList.toggle('open')}function expandAll(b){document.querySelectorAll('.card').forEach(x=>x.classList.toggle('open',b))}function fmt(r){return `${r.name}｜${r.role}\n`+r.arts.map(a=>`${a.role}：${a.name}｜${qs[a.q]||'待核'}｜${a.source}｜效果：${a.effect}｜傷害加成權重：${a.power}｜修煉：${a.training}`).join('\n')+'\n推薦天賦：'+r.talents.map(t=>t.name+'（'+t.effect+'）').join('、')+'\n推薦方向：'+r.priority}function copyOne(i){navigator.clipboard.writeText(fmt(roster[i])).then(()=>alert('已複製'))}function copyAll(){navigator.clipboard.writeText(roster.map(fmt).join('\n\n━━━━━━━━━━\n\n')).then(()=>alert('已複製九套流派'))}const sel=document.getElementById('filter');roster.forEach(r=>sel.add(new Option(r.name,r.name)));sel.onchange=render;document.getElementById('search').oninput=render;render();</script></body></html>
